<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect UI Corner Calculator</title>
    <style>
      :root {
        --bg: #0b1014;
        --card: #1a1f24;
        --accent: #3b82f6;
        --wrong: #ef4444;
        --right: #22c55e;
      }

      body {
        background-color: var(--bg);
        color: white;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px;
      }

      .controls {
        background: #252a30;
        padding: 24px;
        border-radius: 16px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 40px;
        width: 100%;
        max-width: 500px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 14px;
        color: #94a3b8;
        font-weight: 600;
      }

      input[type="range"] {
        width: 100%;
        cursor: pointer;
      }

      .display-value {
        font-family: monospace;
        color: var(--accent);
        font-size: 18px;
      }

      .comparison {
        display: flex;
        gap: 40px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .preview-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      /* THE CORE COMPONENT */
      .outer-box {
        width: 240px;
        height: 180px;
        background: var(--card);
        display: flex;
        transition: border-radius 0.2s ease;
      }

      .inner-box {
        flex: 1;
        background: var(--accent);
        opacity: 0.8;
        transition: border-radius 0.2s ease;
      }

      .label-tag {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <h1>UI Corner Calculator</h1>

    <div class="controls">
      <div class="control-group">
        <label
          >Inner Radius:
          <span id="innerVal" class="display-value">20</span>px</label
        >
        <input type="range" id="innerRadius" min="0" max="60" value="20" />
      </div>
      <div class="control-group">
        <label
          >Padding: <span id="padVal" class="display-value">20</span>px</label
        >
        <input type="range" id="padding" min="0" max="60" value="20" />
      </div>
    </div>

    <div class="comparison">
      <div class="preview-card">
        <span class="label-tag" style="background: var(--wrong)"
          >Incorrect (Equal)</span
        >
        <div id="wrongOuter" class="outer-box">
          <div id="wrongInner" class="inner-box"></div>
        </div>
        <p id="wrongLabel">Outer: 20px | Inner: 20px</p>
      </div>

      <div class="preview-card">
        <span class="label-tag" style="background: var(--right)"
          >Correct (Concentric)</span
        >
        <div id="rightOuter" class="outer-box">
          <div id="rightInner" class="inner-box"></div>
        </div>
        <p id="rightLabel">Outer: 40px | Inner: 20px</p>
      </div>
    </div>

    <script>
      const inInput = document.getElementById("innerRadius");
      const padInput = document.getElementById("padding");

      function update() {
        const rInner = parseInt(inInput.value);
        const pad = parseInt(padInput.value);
        const rOuter = rInner + pad;

        document.getElementById("innerVal").innerText = rInner;
        document.getElementById("padVal").innerText = pad;

        // Update "Incorrect" Side
        const wOuter = document.getElementById("wrongOuter");
        const wInner = document.getElementById("wrongInner");
        wOuter.style.borderRadius = rInner + "px";
        wOuter.style.padding = pad + "px";
        wInner.style.borderRadius = rInner + "px";
        document.getElementById("wrongLabel").innerText =
          `Outer: ${rInner}px | Inner: ${rInner}px`;

        // Update "Correct" Side
        const rOuterEl = document.getElementById("rightOuter");
        const rInnerEl = document.getElementById("rightInner");
        rOuterEl.style.borderRadius = rOuter + "px";
        rOuterEl.style.padding = pad + "px";
        rInnerEl.style.borderRadius = rInner + "px";
        document.getElementById("rightLabel").innerText =
          `Outer: ${rOuter}px | Inner: ${rInner}px`;
      }

      inInput.addEventListener("input", update);
      padInput.addEventListener("input", update);
      update();
    </script>
  </body>
</html>
